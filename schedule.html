<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule | LIFE DASHBOARD</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f7fa;
            color: #1f2933;
        }

        /* =========================
           Header
        ========================= */

        header {
            padding: 28px 30px 20px;
            border-bottom: 1px solid #e1e6eb;
            background: #ffffff;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header-subtitle {
            margin-top: 4px;
            font-size: 12px;
            color: #8a94a3;
            letter-spacing: 1px;
        }

        #auth-status {
            margin-top: 8px;
            font-size: 12px;
            color: #42d392;
        }

        /* =========================
           Main
        ========================= */

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;

            color: #697482;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #42d392;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .description {
            margin-top: 6px;
            color: #8a94a3;
            font-size: 13px;
        }

        /* =========================
           Calendar
        ========================= */

        .calendar-container {
            margin-top: 30px;
            padding: 22px;

            background: #ffffff;
            border: 1px solid #e1e6eb;
            border-radius: 12px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 20px;
            font-weight: 700;
        }

        .calendar-nav {
            display: flex;
            gap: 8px;
        }

        .calendar-nav button {
            padding: 7px 12px;

            border: 1px solid #d8dee5;
            border-radius: 7px;

            background: #ffffff;
            color: #4b5563;

            cursor: pointer;
            font-size: 12px;
        }

        .calendar-nav button:hover {
            border-color: #42d392;
            color: #42d392;
        }

        /* =========================
           Weekdays
        ========================= */

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);

            margin-bottom: 5px;
        }

        .weekday {
            padding: 8px 0;

            text-align: center;
            font-size: 11px;
            color: #8a94a3;
            font-weight: 600;
        }

        /* =========================
           Calendar Grid
        ========================= */

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);

            border-top: 1px solid #e8edf1;
            border-left: 1px solid #e8edf1;
        }

        .calendar-day {
            position: relative;

            min-height: 82px;
            padding: 8px;

            border-right: 1px solid #e8edf1;
            border-bottom: 1px solid #e8edf1;

            background: #ffffff;

            cursor: pointer;
            transition: background 0.15s;
        }

        .calendar-day:hover {
            background: #f8fafb;
        }

        .calendar-day.other-month {
            color: #c5cbd2;
            background: #fafbfc;
        }

        .calendar-day.today {
            background: #f0faf6;
        }

        .calendar-day.selected {
            box-shadow: inset 0 0 0 2px #42d392;
        }

        .day-number {
            font-size: 13px;
            font-weight: 600;
        }

        .calendar-day.today .day-number {
            color: #42d392;
        }

        /* =========================
           Schedule Dot
        ========================= */

        .schedule-dot {
            position: absolute;

            bottom: 8px;
            left: 8px;

            width: 6px;
            height: 6px;

            border-radius: 50%;
            background: #42d392;
        }

        /* =========================
           Selected Date
        ========================= */

        .selected-date-container {
            margin-top: 25px;
            padding: 20px;

            background: #ffffff;
            border: 1px solid #e1e6eb;
            border-radius: 12px;
        }

        .selected-date-title {
            font-size: 17px;
            font-weight: 700;

            margin-bottom: 15px;
        }

        /* =========================
           Schedule Item
        ========================= */

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .schedule-item {
            display: flex;
            align-items: center;
            gap: 15px;

            padding: 14px;

            border: 1px solid #e1e6eb;
            border-radius: 9px;

            background: #ffffff;
        }

        .schedule-time {
            min-width: 55px;

            font-size: 13px;
            font-weight: 700;
            color: #42d392;
        }

        .schedule-content {
            flex: 1;
            min-width: 0;
        }

        .schedule-title {
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        .schedule-actions {
            display: flex;
            gap: 6px;
        }

        /* =========================
           完了済み予定
        ========================= */

        .schedule-item.completed {
            opacity: 0.55;
        }

        .schedule-item.completed .schedule-title {
            text-decoration: line-through;
            color: #697482;
        }

        /* =========================
           Buttons
        ========================= */

        .complete-button {
            padding: 7px 10px;

            border: 1px solid #3b4654;
            border-radius: 7px;

            background: transparent;
            color: #8993a1;

            font-size: 11px;
            cursor: pointer;
        }

        .complete-button:hover {
            color: #42d392;
            border-color: #42d392;
        }

        .complete-button.completed {
            color: #42d392;
            border-color: #42d392;
        }

        .edit-button,
        .delete-button {
            padding: 7px 10px;

            border-radius: 7px;

            background: transparent;

            font-size: 11px;
            cursor: pointer;
        }

        .edit-button {
            border: 1px solid #b8c0ca;
            color: #697482;
        }

        .edit-button:hover {
            border-color: #42d392;
            color: #42d392;
        }

        .delete-button {
            border: 1px solid #d8a4a4;
            color: #b56b6b;
        }

        .delete-button:hover {
            border-color: #d95353;
            color: #d95353;
        }

        .no-schedule {
            padding: 20px 0;

            color: #9aa3ad;
            text-align: center;
            font-size: 13px;
        }

        /* =========================
           Add Schedule
        ========================= */

        .add-schedule-container {
            margin-top: 25px;
            padding: 22px;

            background: #ffffff;
            border: 1px solid #e1e6eb;
            border-radius: 12px;
        }

        .section-title {
            margin-bottom: 18px;

            font-size: 17px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            margin-bottom: 6px;

            font-size: 12px;
            font-weight: 600;
            color: #697482;
        }

        .form-group input {
            width: 100%;

            padding: 11px 12px;

            border: 1px solid #d8dee5;
            border-radius: 7px;

            background: #ffffff;

            font-size: 14px;
            color: #1f2933;

            outline: none;
        }

        .form-group input:focus {
            border-color: #42d392;
            box-shadow: 0 0 0 2px rgba(66, 211, 146, 0.08);
        }

        #add-schedule-button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #42d392;
            color: #ffffff;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;
        }

        #add-schedule-button:hover {
            opacity: 0.9;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 700px) {

            main {
                padding: 20px 12px 40px;
            }

            .calendar-container {
                padding: 12px;
            }

            .calendar-day {
                min-height: 65px;
                padding: 6px;
            }

            .day-number {
                font-size: 12px;
            }

            .schedule-item {
                flex-wrap: wrap;
                gap: 8px;
            }

            .schedule-content {
                width: calc(100% - 70px);
            }

            .schedule-actions {
                width: 100%;
                justify-content: flex-end;
            }

        }

    </style>

</head>

<body>

    <!-- =========================
         Header
    ========================= -->

    <header>

        <div class="header-title">
            LIFE DASHBOARD
        </div>

        <div class="header-subtitle">
            YOUR LIFE. YOUR DATA. YOUR DASHBOARD.
        </div>

        <div id="auth-status">
            Connecting...
        </div>

    </header>


    <!-- =========================
         Main
    ========================= -->

    <main>

        <a href="./index.html" class="back-link">
            ← Dashboard
        </a>


        <h1>
            Schedule
        </h1>

        <div class="description">
            予定を管理します。
        </div>


        <!-- =========================
             Calendar
        ========================= -->

        <div class="calendar-container">

            <div class="calendar-header">

                <div
                    id="calendar-title"
                    class="calendar-title">
                </div>

                <div class="calendar-nav">

                    <button id="prev-month">
                        ← 前月
                    </button>

                    <button id="today-month">
                        今日
                    </button>

                    <button id="next-month">
                        次月 →
                    </button>

                </div>

            </div>


            <div class="weekdays">

                <div class="weekday">日</div>
                <div class="weekday">月</div>
                <div class="weekday">火</div>
                <div class="weekday">水</div>
                <div class="weekday">木</div>
                <div class="weekday">金</div>
                <div class="weekday">土</div>

            </div>


            <div
                id="calendar-grid"
                class="calendar-grid">
            </div>

        </div>


        <!-- =========================
             Selected Date
        ========================= -->

        <div class="selected-date-container">

            <div
                id="selected-date-title"
                class="selected-date-title">
                予定
            </div>

            <div
                id="schedule-list"
                class="schedule-list">
            </div>

        </div>


        <!-- =========================
             Add Schedule
        ========================= -->

        <div class="add-schedule-container">

            <div class="section-title">
                予定を追加
            </div>


            <div class="form-group">

                <label for="schedule-date">
                    日付
                </label>

                <input
                    type="date"
                    id="schedule-date">

            </div>


            <div class="form-group">

                <label for="schedule-time">
                    時刻
                </label>

                <input
                    type="time"
                    id="schedule-time">

            </div>


            <div class="form-group">

                <label for="schedule-title">
                    予定
                </label>

                <input
                    type="text"
                    id="schedule-title"
                    placeholder="例：AWS SAA勉強">

            </div>


            <button id="add-schedule-button">
                予定を追加
            </button>

        </div>

    </main>


    <!-- =========================
         JavaScript
    ========================= -->

    <script type="module">

        import "./js/schedule.js";

    </script>

</body>

</html>
